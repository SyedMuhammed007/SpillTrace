<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SpillTrace — Satellite-to-Vessel Oil Spill Analysis</title>
<meta name="description" content="SpillTrace transforms satellite observations, environmental drift analysis and vessel trajectory evidence into a single investigative intelligence workflow."/>
<link rel="icon" href="assets/images/logo.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #060606;
    font-family: "Manrope", Arial, sans-serif;
  }

  /* ── Full-screen video wrapper ── */
  .hero-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Background video */
  #heroVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    filter: brightness(0.75) contrast(1.06) saturate(0.72);
  }

  /* Dark gradient — heavy at bottom for text legibility */
  .hero-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,0.30) 0%,
        rgba(0,0,0,0.10) 35%,
        rgba(0,0,0,0.50) 65%,
        rgba(0,0,0,0.88) 100%);
  }

  /* ── Top navigation ── */
  .hero-nav {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .22em;
    text-transform: uppercase;
  }

  .enter-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 28px;
    background: #fff;
    color: #111;
    text-decoration: none;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    border-radius: 999px;
    transition: background .2s;
  }
  .enter-btn:hover { background: #e0e0e0; }

  /* ── Hero text block — anchored to bottom-left ── */
  .hero-copy {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    padding: 0 48px 64px;
    /* hidden via JS on init */
  }

  .hero-kicker {
    display: block;
    font-family: "DM Mono", monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(255,255,255,.6);
    margin-bottom: 18px;
  }

  .hero-copy h1 {
    font-size: clamp(52px, 7.5vw, 120px);
    font-weight: 700;
    line-height: .9;
    letter-spacing: -.065em;
    color: #fff;
    margin-bottom: 20px;
  }

  .hero-copy p {
    max-width: 500px;
    font-size: clamp(15px, 1.3vw, 19px);
    line-height: 1.6;
    color: rgba(255,255,255,.75);
    margin-bottom: 40px;
  }

  /* ── Buttons ── */
  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 18px 34px;
    background: #fff;
    color: #111;
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .07em;
    text-transform: uppercase;
    border-radius: 999px;
    transition: background .2s, transform .18s;
  }
  .btn-primary:hover  { background: #e4e4e4; transform: translateY(-2px); }
  .btn-primary span   { font-size: 18px; }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 18px 34px;
    background: rgba(255,255,255,.07);
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .07em;
    text-transform: uppercase;
    border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,.38);
    backdrop-filter: blur(12px);
    transition: background .2s, transform .18s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,.16); transform: translateY(-2px); }
  .btn-secondary span  { font-size: 18px; }
</style>
</head>

<body>
<div class="hero-wrap">

  <!-- Fullscreen background video -->
  <video id="heroVideo" muted playsinline preload="auto" tabindex="-1">
    <source src="assets/video/landing-bg.mp4" type="video/mp4"/>
  </video>

  <!-- Gradient overlay -->
  <div class="hero-overlay"></div>

  <!-- Top nav -->
  <nav class="hero-nav">
    <a class="wordmark" href="index.html">
      <img src="assets/images/logo-white.ico" alt="SpillTrace" width="22" height="22"/>
      SpillTrace
    </a>
    <a class="enter-btn" href="login.html">
      Enter Platform <span>↗</span>
    </a>
  </nav>

  <!-- Hero text + buttons — revealed when ships appear in video -->
  <div class="hero-copy" id="heroCopy">
    <span class="hero-kicker">From Orbit to Evidence</span>
    <h1>See the spill.<br/>Trace the story.</h1>
    <p>
      Satellite observations, drift reconstruction and vessel intelligence
      brought together in one focused investigative workflow.
    </p>
    <div class="hero-actions">
      <a href="login.html" class="btn-primary" id="btnStart">
        Start Investigation <span>→</span>
      </a>
      <a href="login.html" class="btn-secondary" id="btnExplore">
        Explore Intelligence <span>↓</span>
      </a>
    </div>
  </div>

</div>

<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  'use strict';

  var video  = document.getElementById('heroVideo');
  var copy   = document.getElementById('heroCopy');
  var revealed = false;

  /* -- Hide text immediately -- */
  copy.style.opacity    = '0';
  copy.style.visibility = 'hidden';

  /* -- Reveal function -- */
  function revealHero() {
    if (revealed) return;
    revealed = true;

    /* 1. Make parent visible */
    copy.style.visibility = 'visible';
    copy.style.opacity    = '1';

    /* 2. GSAP staggered slide-up */
    if (typeof gsap !== 'undefined') {
      var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

      tl.fromTo('.hero-kicker',
        { autoAlpha: 0, y: 18 },
        { autoAlpha: 1, y: 0, duration: 0.6 }
      )
      .fromTo('.hero-copy h1',
        { autoAlpha: 0, y: 55, scale: 0.96 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 1.0 },
        '-=0.25'
      )
      .fromTo('.hero-copy p',
        { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.8 },
        '-=0.55'
      )
      .fromTo('#btnStart',
        { autoAlpha: 0, y: 26, scale: 0.94 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.65, ease: 'back.out(1.5)' },
        '-=0.45'
      )
      .fromTo('#btnExplore',
        { autoAlpha: 0, y: 26, scale: 0.94 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.65, ease: 'back.out(1.5)' },
        '-=0.52'
      );
    } else {
      /* No GSAP — just show */
      copy.style.transition = 'opacity 0.8s ease';
    }
  }

  /* -- Video logic -- */
  if (video) {
    video.muted       = true;
    video.playsInline = true;

    /* Start playback */
    video.addEventListener('canplay', function () {
      video.play().catch(function () {
        /* Autoplay blocked — show text straight away */
        revealHero();
      });
    });

    /* ✅ Reveal ONLY after video fully ends — stays paused on last frame (ships) */
    video.addEventListener('ended', function () {
      video.pause(); /* freeze on last frame */
      revealHero();
    });

    /* Fallback: video failed */
    video.addEventListener('error', function () {
      video.style.display = 'none';
      revealHero();
    });

    /* Hard timeout — reveal after 60 s max if ended never fires */
    setTimeout(revealHero, 60000);

  } else {
    revealHero();
  }
}());
</script>
</body>
</html>
