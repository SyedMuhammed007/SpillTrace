<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign In — SpillTrace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='3' fill='%235B8CFF'/%3E%3Cpath d='M2.5 12c0-2 4.2-3.6 9.5-3.6s9.5 1.6 9.5 3.6' stroke='%23F5F5F2' fill='none' stroke-width='1.5'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/reset.css"/>
<link rel="stylesheet" href="css/variables.css"/>
<link rel="stylesheet" href="css/global.css"/>
<link rel="stylesheet" href="css/layout.css"/>
<link rel="stylesheet" href="css/components.css"/>
<link rel="stylesheet" href="css/animations.css"/>
<link rel="stylesheet" href="css/responsive.css"/>
</head>
<body data-page="login">

<div class="login-split">
  <div class="login-visual">
    <div class="bg" style="background-image:url('assets/images/ocean-texture.png')" data-parallax="40"></div>
    <div class="inner">
      <a class="wordmark" href="index.html" style="display:flex;align-items:center;gap:11px;font:600 14px/1 var(--font-sans);letter-spacing:.24em;color:#F5F5F2">
        <img src="assets/images/logo-white.ico" alt="SpillTrace logo" width="24" height="24"/>
        SpillTrace
      </a>
      <div>
        <div class="meta" style="color:rgba(245,245,242,.55)">26.184° N, -91.245° W</div>
        <div class="sysline" style="margin-top:12px;display:flex;align-items:center;gap:9px;font:500 10px/1 var(--font-mono);letter-spacing:.2em;color:rgba(245,245,242,.55)"><i style="width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulseOk 2.4s infinite"></i>SYSTEM STATUS — OPERATIONAL</div>
      </div>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-box">
      <span class="eyebrow">Investigator access</span>
      <h1 class="h-page" style="font-size:clamp(34px,3.4vw,48px);margin:16px 0 8px">Welcome back.</h1>
      <p class="body" style="margin-bottom:36px">Continue your investigation.</p>
      <form id="loginForm" novalidate>
        <div class="field" style="margin-bottom:18px">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" value="investigator@spilltrace.ai" autocomplete="username"/>
        </div>
        <div class="field" style="margin-bottom:26px">
          <label for="pass">Password</label>
          <input class="input" id="pass" type="password" value="••••••••••" autocomplete="current-password"/>
        </div>
        <a href="dashboard.html" class="btn btn-light" id="loginBtn" style="width:100%">Sign In</a>
        <div class="form-msg" id="formMsg"></div>
      </form>
      <p class="meta" style="margin-top:30px">Demo credentials are prefilled · no backend attached</p>
    </div>
  </div>
</div>

<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/router.js"></script>
<script src="js/animations.js"></script>
<script src="js/interactions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
